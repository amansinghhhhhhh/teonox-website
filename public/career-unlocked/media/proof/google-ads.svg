<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" font-family="DM Sans, Arial, Helvetica, sans-serif">
  <defs>
    <filter id="blur" x="-20%" y="-60%" width="140%" height="220%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF9A3D"/>
      <stop offset="100%" stop-color="#FF6B1A"/>
    </linearGradient>
  </defs>

  <rect width="960" height="600" fill="#FFFDF9"/>
  <rect x="0" y="0" width="960" height="64" fill="#1E1611"/>
  <circle cx="34" cy="32" r="9" fill="#FF6B1A"/>
  <text x="54" y="38" fill="#FFFFFF" font-size="19" font-weight="700">Google Ads · Campaign performance</text>
  <rect x="756" y="18" width="176" height="28" rx="14" fill="#FF6B1A"/>
  <text x="844" y="37" fill="#FFFFFF" font-size="13" font-weight="700" text-anchor="middle">DEMO DATA</text>

  <text x="40" y="98" font-size="13" fill="#6B5E53">Account</text>
  <rect x="106" y="82" width="220" height="24" rx="8" fill="#EFE6DA"/>
  <rect x="116" y="89" width="196" height="10" rx="5" fill="#B9A896" filter="url(#blur)"/>
  <text x="660" y="98" font-size="13" font-weight="700" fill="#E24A0B">Customer ID blurred · awaiting approval</text>

  <g>
    <rect x="40" y="122" width="212" height="94" rx="16" fill="#FFFFFF" stroke="#EADFD0"/>
    <text x="60" y="154" font-size="13" fill="#6B5E53">Clicks</text>
    <text x="60" y="188" font-size="30" font-weight="800" fill="#1E1611">18,204</text>
    <text x="60" y="206" font-size="12" font-weight="700" fill="#12A150">▲ 74.2%</text>

    <rect x="264" y="122" width="212" height="94" rx="16" fill="#FFFFFF" stroke="#EADFD0"/>
    <text x="284" y="154" font-size="13" fill="#6B5E53">Impressions</text>
    <text x="284" y="188" font-size="30" font-weight="800" fill="#1E1611">6,41,880</text>
    <text x="284" y="206" font-size="12" font-weight="700" fill="#6B5E53">search + display</text>

    <rect x="488" y="122" width="212" height="94" rx="16" fill="#FFFFFF" stroke="#EADFD0"/>
    <text x="508" y="154" font-size="13" fill="#6B5E53">Avg. CPC</text>
    <text x="508" y="188" font-size="30" font-weight="800" fill="#1E1611">₹18.60</text>
    <text x="508" y="206" font-size="12" font-weight="700" fill="#12A150">▼ 32.5%</text>

    <rect x="712" y="122" width="208" height="94" rx="16" fill="#1E1611"/>
    <text x="732" y="154" font-size="13" fill="#CDBFB1">Conversions</text>
    <text x="732" y="188" font-size="30" font-weight="800" fill="#FF9A3D">946</text>
    <text x="732" y="206" font-size="12" font-weight="700" fill="#CDBFB1">CPA ₹114</text>
  </g>

  <g stroke="#EADFD0">
    <line x1="40" y1="330" x2="920" y2="330"/>
    <line x1="40" y1="400" x2="920" y2="400"/>
    <line x1="40" y1="470" x2="920" y2="470"/>
  </g>
  <g fill="url(#bar)">
    <rect x="70" y="404" width="56" height="66" rx="8"/>
    <rect x="160" y="376" width="56" height="94" rx="8"/>
    <rect x="250" y="358" width="56" height="112" rx="8"/>
    <rect x="340" y="326" width="56" height="144" rx="8"/>
    <rect x="430" y="344" width="56" height="126" rx="8"/>
    <rect x="520" y="300" width="56" height="170" rx="8"/>
    <rect x="610" y="286" width="56" height="184" rx="8"/>
    <rect x="700" y="256" width="56" height="214" rx="8"/>
    <rect x="790" y="248" width="56" height="222" rx="8"/>
  </g>
  <rect x="40" y="232" width="500" height="40" rx="12" fill="#F4ECE0"/>
  <text x="60" y="258" font-size="14" font-weight="700" fill="#1E1611">Conversions by week</text>
  <text x="470" y="258" font-size="14" font-weight="800" fill="#E24A0B" text-anchor="end">946 total</text>

  <rect x="40" y="500" width="880" height="40" rx="12" fill="#FFFFFF" stroke="#EADFD0"/>
  <text x="60" y="526" font-size="13" fill="#6B5E53">Campaigns</text>
  <rect x="170" y="512" width="300" height="16" rx="8" fill="#C9B9A8" filter="url(#blur)"/>
  <text x="560" y="526" font-size="13" fill="#6B5E53">Search terms</text>
  <rect x="672" y="512" width="230" height="16" rx="8" fill="#DFD2C3" filter="url(#blur)"/>

  <rect x="40" y="550" width="880" height="34" rx="12" fill="#FFE9D6" stroke="#FFC79A"/>
  <text x="480" y="572" font-size="13" font-weight="700" fill="#E24A0B" text-anchor="middle">Placeholder screenshot — customer ID and campaign names blurred until the client approves</text>
</svg>
