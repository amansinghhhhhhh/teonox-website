<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" font-family="DM Sans, Arial, Helvetica, sans-serif">
  <defs>
    <filter id="blur" x="-20%" y="-60%" width="140%" height="220%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FFF6EE"/>
    </linearGradient>
  </defs>

  <rect width="960" height="600" fill="#FFFDF9"/>
  <rect x="0" y="0" width="960" height="64" fill="#1E1611"/>
  <circle cx="34" cy="32" r="9" fill="#FF6B1A"/>
  <text x="54" y="38" fill="#FFFFFF" font-size="19" font-weight="700">Ads Manager · Campaigns</text>
  <rect x="640" y="18" width="180" height="28" rx="14" fill="#3A2E24"/>
  <rect x="652" y="27" width="150" height="10" rx="5" fill="#8C7A6B" filter="url(#blur)"/>
  <rect x="836" y="18" width="96" height="28" rx="14" fill="#FF6B1A"/>
  <text x="884" y="37" fill="#FFFFFF" font-size="13" font-weight="700" text-anchor="middle">DEMO DATA</text>

  <g font-size="13" fill="#6B5E53">
    <text x="40" y="96">Account</text>
  </g>
  <rect x="110" y="80" width="230" height="24" rx="8" fill="#EFE6DA"/>
  <rect x="120" y="87" width="210" height="10" rx="5" fill="#B9A896" filter="url(#blur)"/>
  <text x="700" y="96" font-size="13" fill="#6B5E53">Client name hidden until approved</text>

  <g>
    <rect x="40" y="118" width="212" height="96" rx="16" fill="url(#tile)" stroke="#EADFD0"/>
    <text x="60" y="150" font-size="13" fill="#6B5E53">Reach</text>
    <text x="60" y="184" font-size="30" font-weight="800" fill="#1E1611">4,82,110</text>
    <text x="60" y="204" font-size="12" font-weight="700" fill="#12A150">▲ 38.4%</text>

    <rect x="264" y="118" width="212" height="96" rx="16" fill="url(#tile)" stroke="#EADFD0"/>
    <text x="284" y="150" font-size="13" fill="#6B5E53">Results (leads)</text>
    <text x="284" y="184" font-size="30" font-weight="800" fill="#1E1611">1,264</text>
    <text x="284" y="204" font-size="12" font-weight="700" fill="#12A150">▲ 62.1%</text>

    <rect x="488" y="118" width="212" height="96" rx="16" fill="url(#tile)" stroke="#EADFD0"/>
    <text x="508" y="150" font-size="13" fill="#6B5E53">Amount spent</text>
    <text x="508" y="184" font-size="30" font-weight="800" fill="#1E1611">₹1,42,850</text>
    <text x="508" y="204" font-size="12" font-weight="700" fill="#6B5E53">last 30 days</text>

    <rect x="712" y="118" width="208" height="96" rx="16" fill="#1E1611"/>
    <text x="732" y="150" font-size="13" fill="#CDBFB1">Cost per result</text>
    <text x="732" y="184" font-size="30" font-weight="800" fill="#FF9A3D">₹113</text>
    <text x="732" y="204" font-size="12" font-weight="700" fill="#CDBFB1">▼ 41.0%</text>
  </g>

  <rect x="40" y="238" width="880" height="40" rx="12" fill="#F4ECE0" stroke="#EADFD0"/>
  <g font-size="12" font-weight="700" fill="#6B5E53" letter-spacing="1">
    <text x="60" y="263">CAMPAIGN</text>
    <text x="520" y="263">RESULTS</text>
    <text x="650" y="263">SPEND</text>
    <text x="800" y="263">COST / RESULT</text>
  </g>

  <g>
    <rect x="40" y="288" width="880" height="52" rx="12" fill="#FFFFFF" stroke="#EADFD0"/>
    <rect x="60" y="306" width="330" height="16" rx="8" fill="#C9B9A8" filter="url(#blur)"/>
    <rect x="520" y="306" width="64" height="16" rx="8" fill="#DFD2C3" filter="url(#blur)"/>
    <rect x="650" y="306" width="96" height="16" rx="8" fill="#DFD2C3" filter="url(#blur)"/>
    <rect x="800" y="306" width="90" height="16" rx="8" fill="#DFD2C3" filter="url(#blur)"/>

    <rect x="40" y="350" width="880" height="52" rx="12" fill="#FFFFFF" stroke="#EADFD0"/>
    <rect x="60" y="368" width="270" height="16" rx="8" fill="#C9B9A8" filter="url(#blur)"/>
    <rect x="520" y="368" width="64" height="16" rx="8" fill="#DFD2C3" filter="url(#blur)"/>
    <rect x="650" y="368" width="96" height="16" rx="8" fill="#DFD2C3" filter="url(#blur)"/>
    <rect x="800" y="368" width="90" height="16" rx="8" fill="#DFD2C3" filter="url(#blur)"/>

    <rect x="40" y="412" width="880" height="52" rx="12" fill="#FFFFFF" stroke="#EADFD0"/>
    <rect x="60" y="430" width="300" height="16" rx="8" fill="#C9B9A8" filter="url(#blur)"/>
    <rect x="520" y="430" width="64" height="16" rx="8" fill="#DFD2C3" filter="url(#blur)"/>
    <rect x="650" y="430" width="96" height="16" rx="8" fill="#DFD2C3" filter="url(#blur)"/>
    <rect x="800" y="430" width="90" height="16" rx="8" fill="#DFD2C3" filter="url(#blur)"/>

    <rect x="40" y="474" width="880" height="52" rx="12" fill="#FFFFFF" stroke="#EADFD0"/>
    <rect x="60" y="492" width="240" height="16" rx="8" fill="#C9B9A8" filter="url(#blur)"/>
    <rect x="520" y="492" width="64" height="16" rx="8" fill="#DFD2C3" filter="url(#blur)"/>
    <rect x="650" y="492" width="96" height="16" rx="8" fill="#DFD2C3" filter="url(#blur)"/>
    <rect x="800" y="492" width="90" height="16" rx="8" fill="#DFD2C3" filter="url(#blur)"/>
  </g>

  <rect x="40" y="546" width="880" height="34" rx="12" fill="#FFE9D6" stroke="#FFC79A"/>
  <text x="480" y="568" font-size="13" font-weight="700" fill="#E24A0B" text-anchor="middle">Placeholder screenshot — client names and account IDs blurred until approval</text>
</svg>
